# YuktaiDocs on Netlify (free): Next.js static export.
# `npm run build` writes plain files to out/; Netlify serves them. No server, no functions.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"
    X-Frame-Options = "DENY"

# Pages built by Next.js. Next puts small inline scripts in each page, so these
# allow 'unsafe-inline' scripts but nothing from other sites: YuktAI and Ask page
# come from npm, bundled into the site.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://data.jsdelivr.com https://registry.npmjs.org https://huggingface.co https://*.huggingface.co https://*.hf.co https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; font-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
