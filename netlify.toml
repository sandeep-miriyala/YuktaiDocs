# YuktaiDocs on Netlify (free): Next.js static export.
# `npm run build` writes plain files to out/; Netlify serves them. No server, no functions.
# Old .html addresses redirect to the new routes (public/_redirects).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Every page. Next.js puts small inline scripts in each page, hence 'unsafe-inline';
# outside scripts only from jsDelivr / unpkg (YuktAI for the live demos, jQuery) and Google Tag Manager.
# worker-src blob: runs the Ask page search in a Web Worker; huggingface is only for the
# optional Balanced mode model, downloaded once after the visitor agrees.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://www.googletagmanager.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://data.jsdelivr.com https://registry.npmjs.org https://api.npmjs.org https://huggingface.co https://*.huggingface.co https://*.hf.co https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; font-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"
    X-Frame-Options = "DENY"

# Next.js files have a hash in the name: cache them for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be cached by the browser.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
